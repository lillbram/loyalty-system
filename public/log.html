<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log Stempel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap" id="app" hidden>
  <div>
    <h1>Log</h1>
    <p class="sub">Semua riwayat stempel per pelanggan.</p>
  </div>

  <section class="card">
    <form class="row" id="f">
      <input id="hp" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit">Cari</button>
    </form>
    <p class="msg" id="msg" hidden></p>
  </section>

  <section class="card">
    <span class="lbl" id="title">Terbaru (semua pelanggan)</span>
    <div class="sum" id="sum" hidden></div>
    <div class="list" id="list"></div>
    <button id="all" class="ghost" hidden>Lihat semua pelanggan</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js"></script>
<script>
const $=id=>document.getElementById(id);
let client=null;
const fmt=k=>fmtKey(client.key_type,k);
const dtm=a=>new Date(a).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const name={stamp:l=>'Stempel ke-'+l.stamp_no,undo:l=>'Dibatalkan: ke-'+l.stamp_no,redeem:()=>'Tukar gratis'};
const say=t=>{$('msg').textContent=t;$('msg').hidden=!t};

async function load(p){
  say('');
  const {data,error}=await SB.rpc('key_log',{p});
  if(error){say(sbError(error));if((error.message||'').includes('forbidden'))bye();return}
  const one=!!p;
  if(one&&data.length)$('hp').value=fmt(data[0].key);
  $('title').textContent=one?'Riwayat '+fmt(data.length?data[0].key:p):'Terbaru (semua pelanggan)';
  $('all').hidden=!one;
  const s=$('sum');s.hidden=!one;
  if(one){
    const n=a=>data.filter(l=>l.action===a).length;
    s.innerHTML=`<span><b>${n('stamp')}</b> stempel</span><span><b>${n('redeem')}</b> tukar gratis</span><span><b>${n('undo')}</b> batal</span>`;
  }
  $('list').innerHTML=data.length?data.map(l=>
    `<button class="item" data-p="${l.key}"><span><span class="tag ${l.action}">${name[l.action](l)}</span>${one?'':' '+fmt(l.key)}</span><span>${dtm(l.at)}</span></button>`
  ).join(''):'<p class="empty">Belum ada riwayat.</p>';
}
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  load($('hp').value.trim()||null);
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.item');if(!b)return;
  $('hp').value=fmt(b.dataset.p);load(b.dataset.p);
});
$('all').onclick=()=>{$('hp').value='';load(null)};
(async()=>{
  if(!await guard())return;
  client=await loadClient();if(!client)return;
  applyBrand(client,'Log');
  const k=KEYS[client.key_type]||KEYS.custom,i=$('hp');
  i.type=k.type==='tel'?'tel':'text';i.inputMode=k.mode;i.placeholder=k.ph;i.setAttribute('aria-label',client.key_label);
  $('app').hidden=false;load(null);
})();
</script>
</body>
</html>
