<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kartu Stempel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap" id="root"><p class="hint">Memuat…</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="ui.js"></script>
<script>
const $=id=>document.getElementById(id);
const slug=(new URLSearchParams(location.search).get('c')||'').toLowerCase();
let client=null;
const root=$('root');
const lbl=()=>client.key_label.toLowerCase();
const reward=()=>client.reward_name||'1 gratis';

function viewFatal(t){root.innerHTML=`<p class="err">${escH(t)}</p>`}

// Screen 1: enter the ID.
function viewForm(){
  const k=KEYS[client.key_type]||KEYS.custom;
  root.innerHTML=topBar(client)
    +pageTitle('Cek stempelmu',`Masukkan ${lbl()} yang kamu pakai di kasir.`)
    +`<form id="f" style="display:grid;gap:12px" novalidate>
        <input id="hp" type="${k.type}" inputmode="${k.mode}" placeholder="${escH(k.ph)}" aria-label="${escH(client.key_label)}"
          autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <button class="full" type="submit">Lihat kartu stempel</button>
        <p class="err" id="err" hidden></p>
        <p class="hint">Belum punya kartu? Beli pertamamu, kasir akan mendaftarkan ${lbl()} kamu dan memberi stempel pertama.</p>
      </form>`;
  $('f').addEventListener('submit',async e=>{
    e.preventDefault();
    const er=$('err');er.hidden=true;
    const b=$('f').querySelector('button');b.disabled=true;
    const {data,error}=await SB.rpc('get_card',{s:slug,p:$('hp').value});
    b.disabled=false;
    if(error){er.textContent=sbError(error);er.hidden=false;return}
    viewCard(data);
  });
}

// Screen 2 and 3: stamp card. Full card gets the highlighted reward state.
function viewCard(u){
  const t=client.stamp_total||u.total||10,full=u.stamps>=t;
  root.innerHTML=topBar(client,maskKey(client.key_type,u.key))
    +pageTitle('Kartu stempel',full?`${reward()} siap ditukar.`:`Beli ${t}x, gratis 1.`)
    +stampCard(u,client,{full:'Kartu penuh'})
    +`<section class="qr-block${full?' is-full':''}"><div class="qr-img" id="qr"></div>
        <p>${full?`Tunjukkan QR ini ke kasir untuk tukar ${escH(reward())}`:'Tunjukkan QR ini ke kasir setiap beli'}</p></section>`
    +historyList('Riwayat stempel',u.log)
    +`<button class="link" id="again">Cek ${escH(lbl())} lain</button>`;
  try{new QRCode($('qr'),{text:`LOYALTY:${client.slug}:${u.key}`,width:120,height:120})}catch(e){}
  $('again').onclick=viewForm;
  window.scrollTo(0,0);
}

(async()=>{
  if(!window.SB_READY)return viewFatal('Backend belum diatur. Isi config.js.');
  if(!slug)return viewFatal('Link tidak lengkap. Scan QR dari kedai.');
  const {data,error}=await SB.rpc('get_client',{s:slug});
  if(error)return viewFatal(sbError(error));
  const mm=envMismatch(data);if(mm)return viewFatal(mm);
  client=data;applyBrand(client,'Kartu stempel');
  viewForm();
  const i=$('hp');if(i)i.focus({preventScroll:true});
})();
</script>
</body>
</html>
