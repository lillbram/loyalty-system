<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Profil Kasir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="app.css">
<style>
@media print{
  @page{margin:16mm}
  body{padding:0;background:#fff}
  .wrap{padding:0}
  .wrap>*:not(#posterCard){display:none!important}
  #posterCard{border:0;padding:0;background:none}
  #posterCard>*:not(.poster){display:none!important}
  .poster h2{font-size:40px}
  .poster p{font-size:18px}
}
</style>
</head>
<body>
<main class="wrap" id="root" hidden></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="ui.js"></script>
<script src="nav.js"></script>
<script>
const $=id=>document.getElementById(id);
const root=$('root');
let client=null,email='',KEY='',def='';
// Pending edits of the stamp config. logo: undefined = unchanged, '' = remove, data: URL = new.
let cfg={total:10,reward:''};

function draw(){
  const v=$('url').value.trim()||def;
  $('urlText').textContent=v;
  const q=$('qr');q.innerHTML='';
  try{new QRCode(q,{text:v,width:140,height:140,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  $('warn').hidden=!/^https?:\/\/(localhost|127\.|192\.168\.|10\.|0\.0\.0\.0)/i.test(v);
}

function render(){
  const mark=stampMark(client);
  root.innerHTML=topBar(client,'Kasir')
    +pageTitle('Profil','Akun kasir dan QR cetak untuk pelanggan.')
    +`<section class="hist"><h2>Profil</h2>
        <div class="kv"><span>Email</span><span>${escH(email)}</span></div>
        <div class="kv"><span>Toko</span><span>${escH(client.name)}</span></div>
      </section>

      <section class="sect" style="display:grid;gap:10px"><h2>QR code</h2>
        <div class="card" id="posterCard">
          <div class="poster">
            ${client.logo?`<img class="plogo" src="${escH(client.logo)}" alt="">`:''}
            <h2>${escH(client.name)}</h2>
            <div class="qr-img" id="qr"></div>
            <p><b>Scan untuk cek stempelmu</b><br>Beli ${client.stamp_total||10}x, gratis 1</p>
            <p class="url" id="urlText"></p>
          </div>
          <div class="urlbox">${ic('link')}<input id="url" type="url" inputmode="url" spellcheck="false" aria-label="Alamat halaman pelanggan"></div>
          <p class="hint warn" id="warn" hidden>Alamat ini hanya jalan di jaringan/komputer ini. Sebelum dicetak, ganti dengan alamat publik setelah website di-deploy.</p>
          <p class="hint" style="text-align:center">QR mengarah ke halaman pelanggan. Pelanggan lalu mengetik ${escH(client.key_label.toLowerCase())} untuk melihat kartunya.</p>
          <button class="full sm" id="print" type="button">${ic('print')}Cetak QR</button>
        </div>
      </section>

      <section class="sect" style="display:grid;gap:10px"><h2>Konfigurasi stempel</h2>
        <div class="cfg">
          <div class="cfg-row"><div class="lab"><b>Jumlah stempel</b><span>Untuk 1 kartu penuh</span></div>
            <div class="stepper"><button type="button" id="dec" aria-label="Kurangi">${ic('minus')}</button><output id="tot">${cfg.total}</output><button type="button" id="inc" aria-label="Tambah">${ic('plus')}</button></div></div>
          <div class="cfg-row"><div class="lab"><b>Hadiah</b><span>Didapat saat kartu penuh</span></div>
            <input class="reward" id="rw" maxlength="40" value="${escH(cfg.reward)}" aria-label="Hadiah" autocomplete="off"></div>
          <div class="cfg-row"><div class="lab"><b>Ikon stempel</b><span>Tampil di setiap stempel</span></div>
            <div class="logo-ctl"><div class="logo-prev">${mark}</div>
              <button class="pick" type="button" id="icoBtn">Ganti</button></div></div>
        </div>
        <button class="full sm" id="save" type="button" disabled>Simpan konfigurasi</button>
        <p class="msg" id="msg" hidden></p>
      </section>

      <button class="danger full" id="logout" type="button">Keluar</button>`;

  let u=def;try{u=localStorage.getItem(KEY)||def}catch(e){}
  $('url').value=u;
  $('url').addEventListener('input',()=>{try{localStorage.setItem(KEY,$('url').value.trim())}catch(e){}draw()});
  $('print').onclick=()=>window.print();
  $('logout').onclick=confirmBye;
  draw();

  const dirty=()=>{
    const d=cfg.total!==(client.stamp_total||10)||cfg.reward.trim()!==(client.reward_name||'1 gratis');
    $('save').disabled=!d||!cfg.reward.trim();
  };
  $('dec').onclick=()=>{if(cfg.total>3){cfg.total--;$('tot').textContent=cfg.total;dirty()}};
  $('inc').onclick=()=>{if(cfg.total<20){cfg.total++;$('tot').textContent=cfg.total;dirty()}};
  $('rw').addEventListener('input',e=>{cfg.reward=e.target.value;dirty()});
  $('icoBtn').onclick=openSheet;
  $('save').onclick=save;
  dirty();
}
// Re-render with the pending values, keeping what the user typed.
function keepFocus(){const y=window.scrollY;render();window.scrollTo(0,y)}
function say(t,ok){const m=$('msg');if(!m)return;m.textContent=t||'';m.className='msg '+(ok?'ok':'err');m.hidden=!t}

async function save(){
  const lower=cfg.total<(client.stamp_total||10);
  if(lower&&!confirm('Jumlah stempel diturunkan. Kartu pelanggan yang stempelnya sudah melebihi jumlah baru akan menjadi penuh. Lanjutkan?'))return;
  $('save').disabled=true;
  const {data,error}=await SB.rpc('kasir_save_config',{p_total:cfg.total,p_reward:cfg.reward.trim(),p_logo:null,p_icon:null});
  if(error){
    $('save').disabled=false;
    // The function is missing until supabase/schema.sql is run again.
    return say(/function|schema cache|permission/i.test(error.message||'')?'Fitur ini belum aktif di database. Jalankan schema.sql terbaru.':sbError(error));
  }
  client=data;window.CLIENT=data;cfg={total:data.stamp_total,reward:data.reward_name};
  render();say('Konfigurasi disimpan.',true);
}

/* ---------- bottom sheet: choose the stamp icon (saves right away) ---------- */
function openSheet(){
  if($('sheetBack'))return;
  let sel=client.stamp_icon||'check',logo=client.stamp_logo||null,pend=null;   // pend: null = logo unchanged, '' = remove, data: = new upload
  const back=document.createElement('div');back.id='sheetBack';back.className='sheet-back';
  const prev=document.activeElement;
  const close=()=>{back.remove();document.body.style.overflow='';document.removeEventListener('keydown',onKey);if(prev&&prev.focus)prev.focus()};
  const onKey=e=>{if(e.key==='Escape')close()};
  const note=(t)=>{const m=$('shMsg');if(m){m.textContent=t||'';m.hidden=!t}};
  function draw(){
    back.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <i class="handle"></i>
      <div class="ttl"><h2 id="shT">Pilih ikon stempel</h2><p>Pilih dari 10 ikon bawaan, atau impor logo sendiri.</p></div>
      <div class="pick-grid" role="group" aria-label="Ikon stempel">
        ${STAMP_ICONS.map(([id,nm])=>`<button type="button" class="tile${sel===id?' sel':''}" data-i="${id}" aria-label="${nm}" aria-pressed="${sel===id}">${ic(id)}</button>`).join('')}
        ${logo?`<button type="button" class="tile${sel==='logo'?' sel':''}" data-i="logo" aria-label="Logo sendiri" aria-pressed="${sel==='logo'}"><img src="${escH(logo)}" alt=""></button>`:''}
      </div>
      <div style="display:grid;gap:12px">
        <button class="ghost full" id="shImp" type="button" style="min-height:52px;border-radius:12px">${ic('upload')}Impor ikon sendiri (PNG/SVG)</button>
        <input id="shFile" type="file" accept="image/png,image/svg+xml,image/*">
        <p class="msg err" id="shMsg" hidden></p>
        <button class="full" id="shSave" type="button" style="min-height:52px;border-radius:12px">Simpan ikon</button>
        <div style="display:flex;justify-content:center;gap:20px">
          ${sel!=='check'?'<button class="link" id="shDef" type="button">Pakai centang standar</button>':''}
          ${logo?'<button class="link" id="shDel" type="button">Hapus logo sendiri</button>':''}
        </div>
      </div></div>`;
    back.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=b.dataset.i;draw()});
    $('shImp').onclick=()=>$('shFile').click();
    $('shFile').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      try{logo=pend=await fileToStampLogo(f);sel='logo';draw()}catch(err){note(sbError({message:err.message}))}
    };
    if($('shDef'))$('shDef').onclick=()=>{sel='check';draw()};
    if($('shDel'))$('shDel').onclick=()=>{logo=null;pend='';if(sel==='logo')sel='check';draw()};
    $('shSave').onclick=async()=>{
      $('shSave').disabled=true;note('');
      const {data,error}=await SB.rpc('kasir_save_config',{p_total:client.stamp_total||10,p_reward:client.reward_name||'1 gratis',p_logo:pend,p_icon:sel});
      if(error){$('shSave').disabled=false;return note(/function|schema cache|permission|constraint/i.test(error.message||'')?'Ikon belum aktif di database. Jalankan schema.sql terbaru.':sbError(error))}
      client=data;window.CLIENT=data;close();render();say('Ikon stempel disimpan.',true);
    };
  }
  draw();
  back.addEventListener('click',e=>{if(e.target===back)close()});
  document.body.appendChild(back);document.body.style.overflow='hidden';document.addEventListener('keydown',onKey);
  const first=back.querySelector('.tile.sel')||back.querySelector('.tile');if(first)first.focus();
}

(async()=>{
  const s=await guard();if(!s)return;
  const c=await loadClient();if(!c)return;
  client=c;email=s.user.email||'';
  applyBrand(c,'Profil');
  KEY='customer-url-'+c.slug;
  def=new URL('index.html?c='+encodeURIComponent(c.slug),location.href).href;
  cfg={total:c.stamp_total||10,reward:c.reward_name||'1 gratis'};
  root.hidden=false;render();
})();
</script>
</body>
</html>
