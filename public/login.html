<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masuk Kasir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img id="logo" alt="" hidden>
    <div>
      <h1>Masuk Kasir</h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
  <p class="msg" id="fatal" hidden></p>
  <form class="card" id="login" hidden>
    <label>Email<input id="em" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="go">Masuk</button>
    <p class="msg" id="msg" hidden></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const slug=(new URLSearchParams(location.search).get('c')||'').toLowerCase();
let client=null;
const fail=t=>{$('msg').textContent=t;$('msg').hidden=false;$('go').disabled=false};
const fatal=t=>{$('fatal').textContent=t;$('fatal').hidden=false};

// '' after redirecting on success, else an error message.
async function route(){
  const {data:role}=await SB.rpc('my_role');
  if(role!=='cashier')return 'Akun ini bukan akun kasir.';
  const {data:c,error}=await SB.rpc('my_client');
  if(error||!c||c.slug!==slug)return 'Akun ini bukan kasir '+client.name+'.';
  try{localStorage.setItem('login-slug',slug)}catch(e){}
  location.replace('kasir.html');return '';
}

(async()=>{
  if(!window.SB_READY)return fatal('Backend belum diatur. Isi config.js.');
  if(!slug)return fatal('Link login tidak lengkap. Minta link login kasir dari pengelola.');
  const {data,error}=await SB.rpc('get_client',{s:slug});
  if(error)return fatal('Link login tidak valid atau klien nonaktif.');
  const mm=envMismatch(data);if(mm)return fatal(mm);
  client=data;applyBrand(client,'Masuk Kasir');
  $('sub').textContent=client.name;
  $('login').hidden=false;

  // Already logged in? Skip the form.
  const {data:{session}}=await SB.auth.getSession();
  if(session){const err=await route();if(err){await SB.auth.signOut();fail(err)}}
})();

$('login').addEventListener('submit',async e=>{
  e.preventDefault();$('msg').hidden=true;$('go').disabled=true;
  const {error}=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)return fail('Email atau password salah.');
  const err=await route();
  if(err){await SB.auth.signOut();fail(err)}
});
</script>
</body>
</html>
