<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500&display=swap">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="wrap">
  <div id="app" hidden>
  <div class="brand">
    <img id="logo" alt="" hidden>
    <div>
      <h1 class="brand-name">Kasir</h1>
      <p class="sub">Beri 1 stempel setiap pembelian. Gratis di stempel ke-10.</p>
    </div>
  </div>
  <section class="card">
    <label class="btn big" for="qr">Scan QR pelanggan</label>
    <input id="qr" type="file" accept="image/*" capture="environment">
    <div class="or" id="orlbl">atau ketik ID</div>
    <form class="row" id="f">
      <input id="hp" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" class="ghost">Cari</button>
    </form>
    <p class="msg" id="msg" hidden></p>
  </section>

  <section class="card" id="cust" hidden>
    <div class="head"><span class="phone" id="ph"></span><span class="count" id="ct"></span></div>
    <div class="grid" id="g"></div>
    <div class="status" id="st"></div>
    <button class="big" id="add">+ Beri 1 stempel</button>
    <button class="big gold" id="redeem" hidden>Tukar 1 gratis</button>
    <button class="ghost" id="undo" hidden>Batalkan stempel terakhir</button>
  </section>

  <section class="card">
    <span class="lbl">Aktivitas hari ini</span>
    <div class="log" id="log"></div>
  </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="nav.js"></script>
<script>
const leaf='<svg viewBox="0 0 256 256" aria-hidden="true"><polyline points="216 72 104 184 48 128"/></svg>';
const tm=a=>new Date(a).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const act=l=>l.action==='stamp'?'Stempel ke-'+l.stamp_no:l.action==='undo'?'Batal stempel ke-'+l.stamp_no:'Tukar gratis';
const $=id=>document.getElementById(id);
let client=null,cur=null,card=null,popIdx=0,busy=false,logRows=[];
const fk=k=>fmtKey(client.key_type,k);
function say(txt,ok){const m=$('msg');m.textContent=txt;m.className='msg '+(ok?'ok':'err');m.hidden=!txt}

async function call(fn,args){
  if(busy)return null;busy=true;
  try{const {data,error}=await SB.rpc(fn,args);
    if(error){say(sbError(error));if((error.message||'').includes('forbidden'))bye();return null}
    return data}
  finally{busy=false}
}
async function open(raw,src){
  const c=await call('kasir_open',{p:raw});if(!c)return;
  const isNew=c.stamps===0&&c.free===0&&!c.log.length;
  say(isNew?'Pelanggan baru ditambahkan.':src==='qr'?'QR terbaca.':'',true);
  cur=c.key;card=c;$('hp').value=fk(c.key);render();
}
async function loadLog(){const l=await call('today_log');if(l){logRows=l;renderLog()}}
$('f').addEventListener('submit',e=>{e.preventDefault();open($('hp').value)});

// QR format: LOYALTY:<slug>:<id>
function parseScan(text){
  const m=String(text).match(/^LOYALTY:([^:]+):(.+)$/i);
  if(!m)return {err:'QR bukan kartu loyalty. Coba lagi atau ketik ID.'};
  if(m[1].toLowerCase()!==client.slug)return {err:'QR ini dari program lain.'};
  return {key:m[2]};
}
$('qr').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'),k=Math.min(1,1200/Math.max(img.width,img.height));
    c.width=img.width*k;c.height=img.height*k;
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height);
    const r=window.jsQR?jsQR(d.data,c.width,c.height):null;
    URL.revokeObjectURL(img.src);e.target.value='';
    if(!r){say('QR tidak terbaca. Foto ulang lebih dekat dan terang, atau ketik ID.');return}
    const p=parseScan(r.data);
    if(p.err){say(p.err);return}
    open(p.key,'qr');
  };
  img.src=URL.createObjectURL(f);
});

function render(){
  const u=card;
  $('cust').hidden=false;$('ph').textContent=fk(cur);$('ct').textContent=u.stamps+'/10';
  let h='';for(let i=1;i<=10;i++){const on=i<=u.stamps;h+=`<div class="s ${on?'on':''} ${i===10?'free':''} ${i===popIdx?'pop':''}">${on?leaf:(i===10?'GRATIS':i)}</div>`}
  $('g').innerHTML=h;popIdx=0;
  const full=u.stamps>=10;
  $('st').innerHTML=full?'<b>Kartu penuh.</b> Berikan 1 gratis, lalu tekan tukar.'
    :`${10-u.stamps} pembelian lagi untuk gratis${u.free?` · sudah tukar ${u.free}x`:''}.`;
  $('add').hidden=full;$('redeem').hidden=!full;$('undo').hidden=!u.can_undo;
}
function renderLog(){
  $('log').innerHTML=logRows.length?logRows.slice(0,8).map(l=>`<div><span>${fk(l.key)} · ${act(l)}</span><span>${tm(l.at)}</span></div>`).join(''):'<p class="empty">Belum ada aktivitas hari ini.</p>';
}
async function run(fn,okMsg,pop){
  const c=await call(fn,{p:cur});if(!c)return;
  card=c;popIdx=pop?c.stamps:0;say(okMsg,true);render();
  loadLog();
}
$('add').onclick=()=>run('add_stamp','Stempel ditambahkan.',true);
$('undo').onclick=()=>run('undo_last','Stempel terakhir dibatalkan.');
$('redeem').onclick=()=>run('redeem_free','Gratis ditukar. Kartu mulai dari 0.');

(async()=>{
  if(!await guard())return;
  client=await loadClient();if(!client)return;
  applyBrand(client,'Kasir');
  const k=KEYS[client.key_type]||KEYS.custom,i=$('hp');
  i.type=k.type;i.inputMode=k.mode;i.placeholder=k.ph;i.setAttribute('aria-label',client.key_label);
  $('orlbl').textContent='atau ketik '+client.key_label;
  $('app').hidden=false;loadLog();
})();
</script>

</body>
</html>
